<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4ef"><meta name="description" content="간성초등학교 AI 연수 · AI를 대하는 자세 프레젠테이션"><link rel="icon" href="assets/school-book.svg" type="image/svg+xml"><title>간성초등학교 AI 연수</title><link rel="preload" href="vendor/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="prelude.css"><link rel="stylesheet" href="basic-use.css?v=20261010-chapter-label"><link rel="stylesheet" href="practice.css"><link rel="stylesheet" href="closing.css?v=20261010-return-opening"><link rel="stylesheet" href="usage-tips.css?v=20261010-tips-stage-final"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><link rel="stylesheet" href="details.css?v=20261013-detail-at-end"></head><body><noscript><h1>간성초등학교 AI 연수</h1><h2>목차</h2><ul><li>AI를 대하는 자세</li><li>AI를 &#39;컴퓨터에 설치&#39;하기</li><li>AI 활용 팁</li><li>AI와 함께 일해보기</li><li>AI로 엑셀 다루기 - 품의 목록 작성</li><li>AI로 한글 다루기 - 계획서 작성</li><li>AI로 Canva 다루기 - 수업 PPT 초안 만들기</li><li>AI로 이미지/영상 만들기 - 수업용 애니메이션 만들기</li><li>AI로 바이브코딩하기 — 내 맞춤형 프로그램 만들기</li></ul><h2>AI를 대하는 자세</h2><section><h2>첫 아이디어가 중요합니다.</h2><p>생활 속에서 떠오른 참신한 생각을 흘려보내지 말고, 귀찮음과 불편함을 당연하다고 여기지 말고, 현 상태 개선을 위한 첫 아이디어를 상상해 보세요.</p></section><section><h2>첫 아이디어 구상 외에는 무엇이든 AI와 함께 하세요.</h2><p>그 아이디어에 대해 AI와 의논하고, 조사, 계획, 제작, 수정 등 모든 것을 시켜 보세요. 만드는 방법은, AI에게 개념과 흐름 정도만 대충 배우세요.</p></section><section><h2>AI가 나에게 질문하게 하세요. 모르는 것이 생기면 무엇이든 물어보세요.</h2><p>머리 아픈 세부 구상을 하지 말고, AI가 나에게 질문하며 나의 아이디어를 구체화하도록 만드세요. 무엇이든 이해가 되지 않으면 무엇이든 질문하고 쉽게(초보자 수준, 비유적으로) 알려달라고 하세요.</p></section><section><h2>AI 환각을 막기 위해, 인터넷 조사를 시키고, 감독하세요.</h2><p>AI의 감은 정확하지 않아요. 관련 사례와 더 나은 방법을 인터넷에서 조사하게 하세요. 작업 중 내 의도와 다르거나 의심가는 부분이 있다면, 모든 것을 모른 채 맡기지 말고 의심하세요.</p></section><h2>AI를 '컴퓨터에 설치'하기</h2><section><h2>대답하는 챗봇에서 내 일을 도와주는 에이전트로</h2></section><section><h2>Web이 아닌 App으로 사용하세요 내 컴퓨터에서 함께 일하는 AI</h2></section><section><h2>사용량이 부족하다면? OpenCode 이것만 직접 설치해봅시다</h2></section><section><h2>ChatGPT도, Gemini도 앱으로 이제부터는, 모든 걸 AI에게 맡기세요</h2></section><section><h2>어디서든, 핸드폰으로 내 컴퓨터의 AI와 연결하기</h2></section><h2>AI 활용 팁</h2><section><h2>작업 난이도에 맞는 모델을 선택하세요</h2><p>일상적인 일은 저렴하고 빠른 모델에게,</p><p>복잡한 일만 똑똑하고 비싼 모델에게 맡기세요.</p></section><section><h2>완벽한 지시를 하기 보다, 질문을 받으세요</h2><p>원하는 것은 간단히 말하고, &#x27;질문해&#x27; 한 마디로 아이디어를 구체화하세요.</p></section><section><h2>내가 잘 모르는 분야는 조사해서 답하게 하세요.</h2><p>&#x27;웹리서치&#x27;로 인터넷에서 관련 내용을 심층 조사하도록 시키세요.</p><p>내가 모르는 분야면 검증된 방법/예시인 ‘Best Practice’, &#x27;레퍼런스&#x27;를 찾게 하세요.</p><p>가장 좋은 방법을 알고 싶다면 &#x27;SOTA&#x27;를 찾게 하세요.</p></section><section><h2>중요한 내용은 문서로 남기게 하세요</h2><p>AI의 장기 기억력은 좋지 않아요. (&#x27;컨텍스트&#x27;의 한계)</p><p>계획, 결정, 한 일과 남은 일 등을 AI가 기록하게 하세요.</p><p>새 대화에서도 그 기록을 읽고 이어서 일하게 하세요.</p></section><section><h2>AI에게 권한을 주세요.</h2><p>AI가 자꾸 승인 요청 해 귀찮아지지 않도록, 컴퓨터를 다룰 권한을 주세요.</p><p>단, 중요한 것(계획의 진행 등)은 승인을 받으라고 요청하세요.</p></section><h2>AI와 함께 일해보기</h2><section><h2>AI로 엑셀 다루기 - 품의 목록 작성</h2><p>엑셀 양식과 구매 목록을 주고, 알아서 채우게 하세요</p></section><section><h2>AI로 한글 다루기 - 계획서 작성</h2><p>AI가 다른 앱을 다루게 하는 'MCP'를 이용하여, 한글을 조작하게 하세요</p></section><section><h2>AI로 Canva 다루기 - 수업 PPT 초안 만들기</h2><p>Canva MCP와 작업 요령을 알려주는 ‘스킬’을 활용하여, 수업 PPT 초안을 만들게 하세요.</p></section><section><h2>AI로 이미지/영상 만들기 - 수업용 애니메이션 만들기</h2><p>Higgsfield MCP와 스킬로 이미지들을 만들고, Byteplus를 이용해 수업용 애니메이션을 만들어요</p></section><section><h2>AI로 바이브코딩하기 — 내 맞춤형 프로그램 만들기</h2><p>나에게 맞는 프로그램을 직접 제작하고,<br>GitHub에 올려 공유해보세요</p></section><section><h2>AI 공부는, AI로.<br>모르는 것은 묻고,<br>직접 해보며 배우세요.</h2></section><section><h2>오늘의 연수는 여기까지.<br>AI와 함께하는 배움은 지금부터.</h2></section></noscript><script type="module" src="app.mjs?v=20261013-detail-at-end"></script></body></html>
